name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # When pushing to main: if package.json version equals the latest v* tag
  # but the commit differs, bump patch and push back, so every build gets a
  # unique version. Then always ensure tag v<version> exists at that commit —
  # pushed with GITHUB_TOKEN, which does not trigger new workflow runs — and
  # the publish job below turns it into a stable GitHub Release.
  bump-version:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.result.outputs.version }}
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Decide version & tag
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          HEAD_SHA="$(git rev-parse HEAD)"
          LAST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          LAST_VERSION="${LAST_TAG#v}"
          echo "current=$VERSION last_tag=${LAST_TAG:-none} head=$HEAD_SHA"
          if [ -n "$LAST_VERSION" ] && [ "$LAST_VERSION" = "$VERSION" ] && \
             [ "$(git rev-parse -q --verify "refs/tags/$LAST_TAG" 2>/dev/null || true)" != "$HEAD_SHA" ]; then
            NEW_VERSION="$(node -p "const s='${VERSION}'.split('.').map(Number); s[2]++; s.join('.')")"
            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: bump version to ${NEW_VERSION} [skip ci]"
            git push
            VERSION="$NEW_VERSION"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          # Always ensure the release tag exists at the exact commit we build.
          # GITHUB_TOKEN pushes never trigger new workflow runs, so no loop.
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-parse "$TAG^{commit}")"
            if [ "$EXISTING" != "$HEAD_SHA" ]; then
              echo "::error::tag $TAG already exists at $EXISTING, refusing to move it to $HEAD_SHA" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$HEAD_SHA"
            git push origin "$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: '--win'
          - os: ubuntu-latest
            targets: '--linux'
          - os: macos-latest
            targets: '--mac'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the exact commit bump-version decided on (tag runs use the
          # tagged commit). Resolving github.ref here instead would race with
          # concurrent pushes and package a commit that is not this run's,
          # producing artifacts whose version doesn't match the release.
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build & package
        run: npx electron-vite build && npx electron-builder ${{ matrix.targets }} --publish never
        env:
          # keep unsigned mac build from failing
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp dist-electron/*.exe dist-electron/*.zip stage/ 2>/dev/null || true
          cp dist-electron/*.dmg stage/ 2>/dev/null || true
          cp dist-electron/*.AppImage dist-electron/*.deb stage/ 2>/dev/null || true
          cp dist-electron/latest*.yml stage/ 2>/dev/null || true
          echo "$(node -p 'require("./package.json").version')" > stage/VERSION.txt
          ls -la stage

      - uses: actions/upload-artifact@v4
        with:
          name: gm-${{ matrix.os }}
          path: stage/*
          if-no-files-found: error

  publish:
    needs: [bump-version, build]
    # Explicit result checks — without always(), a skipped bump-version (tag
    # pushes) would propagate "skipped" through build and silently skip this job.
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify version alignment
        run: |
          set -euo pipefail
          VERSION="$(cat dist/VERSION.txt | tr -d '[:space:]')"
          echo "built version: $VERSION"
          # artifacts must carry the version the build actually staged
          if ! ls dist | grep -q "GitHub-Manager-$VERSION-"; then
            echo "::error::no artifacts named GitHub-Manager-$VERSION-* in dist"
            ls dist
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # a tag must point at a commit whose package.json matches the tag,
            # otherwise the "stable" release would ship a different version
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME points to a commit that packages $VERSION — re-tag on a commit whose package.json is $TAG_VERSION"
              exit 1
            fi
          elif [ -n "${{ needs.bump-version.outputs.version }}" ]; then
            # main pushes: what we built must equal what bump-version decided
            DECIDED="${{ needs.bump-version.outputs.version }}"
            if [ "$VERSION" != "$DECIDED" ]; then
              echo "::error::artifacts built at $VERSION but bump-version decided $DECIDED"
              exit 1
            fi
          fi

      - name: Generate last.json (self-update manifest)
        run: |
          set -euo pipefail
          VERSION="$(cat dist/VERSION.txt | tr -d '[:space:]')"
          TAG="v$VERSION"
          SHA="${{ needs.bump-version.outputs.sha || github.sha }}"
          node tools/gen-last-json.mjs \
            --dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --channel stable \
            --notes "GitHub Manager $TAG (commit $SHA)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat dist/VERSION.txt | tr -d '[:space:]')"
          TAG="v$VERSION"
          SHA="${{ needs.bump-version.outputs.sha || github.sha }}"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "publishing $TAG from $SHA"
          rm dist/VERSION.txt
          gh release create "$TAG" dist/* \
            --title "GitHub Manager $TAG" \
            --notes "Release $TAG (commit $SHA, built $DATE). See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for MCP setup." \
            --verify-tag
